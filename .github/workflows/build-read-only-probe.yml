name: Build read-only compatibility probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify fail-closed source configuration
        run: |
          grep -F '#define GESTALT_ENABLE_WRITES 0' GestaltEdit/GestaltAccess.m
          grep -F '#define GESTALT_READ_ONLY_PROBE 1' GestaltEdit/GestaltAccess.m
          grep -F '#if GESTALT_READ_ONLY_PROBE && GESTALT_ENABLE_WRITES' GestaltEdit/GestaltAccess.m
          grep -F 'if (![[self class] areWritesEnabled])' GestaltEdit/GestaltAccess.m
          grep -F '(requireWriteAccess ? O_RDWR : O_RDONLY)' GestaltEdit/GestaltAccess.m
          grep -F '#if GESTALT_WRITE_BUILD' GestaltEdit/NeoSpringView.swift
          grep -F '24A435' GestaltEdit/GestaltAccess.m
          grep -F '"iPhone18,2": .init(marketingName: "iPhone 17 Pro Max", regulatoryModel: "A3257")' GestaltEdit/GestaltModels.swift

      - name: Run isolated safety and compiler-rejection tests
        run: |
          node tests/verify-source.mjs
          bash tests/run-safety-tests.sh

      - name: Audit source capabilities
        run: |
          if grep -R -n -E --include='*.swift' --include='*.m' --include='*.mm' --include='*.c' \
            'URLSession|NSURLSession|NSURLConnection|CFNetwork|NWConnection|Network\.framework' GestaltEdit; then
            echo 'Unexpected network API reference in application source.' >&2
            exit 1
          fi
          if find GestaltEdit -name '*.entitlements' -print -quit | grep -q .; then
            echo 'Unexpected entitlements file in read-only probe source.' >&2
            exit 1
          fi
          if grep -F 'CODE_SIGN_ENTITLEMENTS' GestaltEdit.xcodeproj/project.pbxproj; then
            echo 'Unexpected CODE_SIGN_ENTITLEMENTS setting in read-only probe project.' >&2
            exit 1
          fi

      - name: Build unsigned read-only archive
        run: |
          xcodebuild archive \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GestaltEditReadOnly.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=GESTALT_READ_ONLY_BUILD \
            'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) GESTALT_READ_ONLY_PROBE=1 GESTALT_ENABLE_WRITES=0'

      - name: Verify and package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/GestaltEditReadOnly.xcarchive/Products/Applications/GestaltEdit.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"
          test ! -f "$APP/embedded.mobileprovision"
          test ! -d "$APP/PlugIns"
          test ! -d "$APP/Frameworks"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = me.ssus.gestaltedit.readonlyprobe
          if nm -u "$APP/GestaltEdit" | grep -E '_(ftruncate|fsync)$'; then
            echo 'MobileGestalt write implementation was not excluded.' >&2
            exit 1
          fi
          strings "$APP/GestaltEdit" | grep -F 'This is a read-only compatibility probe. MobileGestalt writes are disabled.'
          otool -L "$APP/GestaltEdit" | tee "$RUNNER_TEMP/GestaltEdit.binary-libraries.txt"
          if grep -E 'CFNetwork\.framework|Network\.framework|WebKit\.framework' "$RUNNER_TEMP/GestaltEdit.binary-libraries.txt"; then
            echo 'Unexpected direct network or respring framework dependency.' >&2
            exit 1
          fi
          shasum -a 256 "$APP/GestaltEdit" > "$RUNNER_TEMP/GestaltEdit.binary.sha256"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          find Payload -type f -exec shasum -a 256 {} \; | LC_ALL=C sort > GestaltEdit-reviewed.manifest.sha256
          zip -qry GestaltEdit-reviewed-unsigned.ipa Payload
          shasum -a 256 GestaltEdit-reviewed-unsigned.ipa > GestaltEdit-reviewed-unsigned.ipa.sha256

      - name: Publish build audit summary
        run: |
          cat "$RUNNER_TEMP/GestaltEdit.binary.sha256"
          cat "$RUNNER_TEMP/GestaltEdit-reviewed-unsigned.ipa.sha256"
          cat "$RUNNER_TEMP/GestaltEdit.binary-libraries.txt"
          {
            echo '## Read-only probe audit'
            echo
            echo '### Main binary SHA-256'
            echo '```text'
            cat "$RUNNER_TEMP/GestaltEdit.binary.sha256"
            echo '```'
            echo
            echo '### Unsigned IPA SHA-256'
            echo '```text'
            cat "$RUNNER_TEMP/GestaltEdit-reviewed-unsigned.ipa.sha256"
            echo '```'
            echo
            echo '### Direct binary dependencies'
            echo '```text'
            cat "$RUNNER_TEMP/GestaltEdit.binary-libraries.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload read-only probe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GestaltEdit-reviewed-unsigned-DO-NOT-INSTALL-ON-RC
          path: |
            ${{ runner.temp }}/GestaltEdit-reviewed-unsigned.ipa
            ${{ runner.temp }}/GestaltEdit-reviewed-unsigned.ipa.sha256
            ${{ runner.temp }}/GestaltEdit.binary.sha256
            ${{ runner.temp }}/GestaltEdit.binary-libraries.txt
            ${{ runner.temp }}/GestaltEdit-reviewed.manifest.sha256
          if-no-files-found: error
          retention-days: 7
